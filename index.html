<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ecologists Field Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a field-station terminal — dark moss panels, a left-aligned tab rail, dense scannable tables with semantic chips. */
:root{
  --bg:#13160f; --panel:#1b1f16; --panel-2:#22281b; --line:#323c27; --text:#e4e0cb; --muted:#9c9b86;
  --accent:#b9c86c; --accent-ink:#1a1f10; --good:#83b86c; --bad:#d6684f; --warn:#d9a94b; --info:#79a9c9;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow","Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--body)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:16px}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px}
h1{font:700 30px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0;text-wrap:balance}
h1 small{display:block;font:500 13px/1.3 var(--body);letter-spacing:.02em;text-transform:none;color:var(--muted);margin-top:4px}
.kpis{display:flex;flex-wrap:wrap;gap:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;min-width:120px}
.kpi b{display:block;font:600 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:14px 0}
nav.tabs a{font:600 16px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;text-decoration:none;color:var(--muted);padding:9px 14px;border-radius:5px;border:1px solid transparent}
nav.tabs a:hover{color:var(--text);border-color:var(--line)}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.status{font-size:13px;color:var(--muted);margin:6px 0}
.status.err{color:var(--bad)}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.panel h2{font:600 19px/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.field.wide{grid-column:1/-1}
input,select,textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:7px 9px;min-width:0;width:100%}
textarea{min-height:60px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--bad)}
.btn.small{padding:3px 8px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{font-size:13px;margin-top:8px}
.msg.err{color:var(--bad)} .msg.ok{color:var(--good)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.toolbar input,.toolbar select{width:auto;min-width:150px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:600 14px/1.2 var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--panel);position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:#1c2117}
td{white-space:nowrap}
td.notes{color:var(--muted);max-width:340px;min-width:180px;white-space:normal}
.toolbar input[type=checkbox]{min-width:0}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
.in{color:var(--good)} .out{color:var(--bad)}
.q-Pristine{color:var(--warn)} .q-High{color:var(--info)} .q-Normal{color:var(--muted)}
.st-Alive{color:var(--good)} .st-MIA{color:var(--warn)} .st-KIA{color:var(--bad)} .st-Retired{color:var(--muted)}
.tm-Doctor{color:var(--bad)} .tm-Military{color:var(--good)} .tm-Researcher,.tm-Professor{color:var(--info)}
.stock-pos{color:var(--good);font-weight:600} .stock-neg{color:var(--bad);font-weight:700} .stock-zero{color:#5f6153}
.link{background:none;border:0;padding:0;text-align:left;color:var(--text);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.link:hover{text-decoration-color:var(--accent)}
.group td{background:var(--panel-2);cursor:pointer;font-weight:600}
.group td .chev{display:inline-block;width:14px;color:var(--accent)}
.thumb{width:40px;height:40px;border-radius:5px;background:#34352e;object-fit:contain;display:block}
.thumb.ph{display:grid;place-items:center;color:#6a6b5c;font-size:11px}
.profile{display:grid;grid-template-columns:minmax(220px,1fr) minmax(220px,1fr) 240px;gap:14px}
@media (max-width:820px){.profile{grid-template-columns:1fr}}
dl.info{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
dl.info dt{color:var(--muted);font-size:13px}
dl.info dd{margin:0}
.photo{width:100%;aspect-ratio:1;border-radius:8px;background:#34352e;object-fit:contain;display:grid;place-items:center;color:#6a6b5c}
.empty{padding:28px;text-align:center;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(5,7,3,.72);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
.overlay.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(640px,100%)}
.modal h2{font:600 22px/1.1 var(--display);text-transform:uppercase;letter-spacing:.05em;margin:0 0 12px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.split{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px;width:min(380px,100%)}
.gate h1{margin-bottom:6px}
.gate p{color:var(--muted);margin:0 0 16px;font-size:14px}
.gate .field{margin-bottom:10px}
.whoami{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted);justify-content:flex-end;width:100%}
.hidden{display:none!important}
.picker{position:relative;display:inline-block;width:280px;max-width:100%}
.picker input{padding-right:30px;cursor:pointer}
.picker input:focus{cursor:text}
.picker .caret{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);cursor:pointer;font-size:13px}
.picklist{position:absolute;left:0;right:0;top:calc(100% + 2px);z-index:30;max-height:460px;overflow-y:auto;background:var(--panel-2);border:1px solid #4a5638;border-radius:4px;box-shadow:0 10px 28px rgba(0,0,0,.55);padding:2px 0}
.picklist .opt{padding:4px 12px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picklist .opt.hi{background:#9cc3f5;color:#10140b}
.picklist .opt.cur:not(.hi){color:var(--accent)}
.picklist .none{padding:6px 12px;color:var(--muted)}

nav.tabs a{position:relative}
.tabdot{position:absolute;top:3px;right:3px;width:10px;height:10px;border-radius:50%;background:#e5484d;box-shadow:0 0 0 2px var(--bg)}
.chatlist{position:relative}
.chatform{position:relative}
.mention{color:#ffd166;background:rgba(255,209,102,.12);border-radius:3px;padding:0 2px;font-weight:600}
.mention.me{color:#10140b;background:#ffd166}
.cmsg.pinged{background:rgba(255,209,102,.08);box-shadow:inset 3px 0 0 #ffd166}
.cmsg.pinged:hover{background:rgba(255,209,102,.13)}
.mentionbox{position:absolute;left:0;bottom:calc(100% + 4px);width:min(360px,100%);background:var(--panel-2);border:1px solid #4a5638;border-radius:6px;box-shadow:0 10px 28px rgba(0,0,0,.55);padding:4px 0;z-index:30}
.mentionbox .mh{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:2px 12px 4px}
.mentionbox .mo{padding:5px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.mentionbox .mo.hi{background:#9cc3f5;color:#10140b}
.mentionbox .mo small{color:var(--muted)}
.mentionbox .mo.hi small{color:#2a3320}
.newline{display:flex;align-items:center;gap:8px;margin:8px 0 4px;transition:opacity .6s}
.newline::before{content:"";flex:1;height:1px;background:#e5484d}
.newline span{font:700 11px/1 var(--body);letter-spacing:.06em;color:#fff;background:#e5484d;padding:3px 6px;border-radius:4px}
.newline.fade{opacity:0}
.unread{display:inline-block;min-width:18px;padding:1px 6px;border-radius:999px;background:var(--bad);color:#fff;font:600 12px/1.3 var(--body);letter-spacing:0;vertical-align:2px}
.chatbox{display:flex;flex-direction:column;height:min(70vh,640px)}
.chatlist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding:4px 2px 8px}
.cmsg{padding:6px 10px;border-radius:6px;position:relative}
.cmsg:hover{background:var(--panel-2)}
.cmsg .who{font-weight:600;color:var(--accent)}
.cmsg.mine .who{color:var(--info)}
.cmsg .when{font-size:12px;color:var(--muted);margin-left:8px}
.cmsg .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.cmsg .tools{position:absolute;right:8px;top:-12px;display:none;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px;box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:5}
.cmsg:hover .tools,.cmsg .tools:focus-within{display:flex}
.cmsg .tools button{background:none;border:0;border-radius:4px;padding:3px 7px;cursor:pointer;font-size:14px;color:var(--text)}
.cmsg .tools button:hover{background:var(--panel-2)}
.cmsg .tools .danger{color:var(--bad)}
.rq{font-size:13px;color:var(--muted);margin:0 0 2px 14px;position:relative;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rq::before{content:"";position:absolute;left:-12px;top:8px;width:10px;height:9px;border-left:2px solid #4a5638;border-top:2px solid #4a5638;border-top-left-radius:5px}
.rq b{color:var(--text);font-weight:600;margin-right:4px}
.rq:hover{color:var(--text)}
.cmsg.flash{animation:flash 1.6s}
@keyframes flash{0%,30%{background:rgba(156,195,245,.25)}100%{background:transparent}}
.reacts{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.react{display:inline-flex;align-items:center;gap:5px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:13px;cursor:pointer;color:var(--text)}
.react:hover{border-color:#6b7a50}
.react.on{background:rgba(156,195,245,.15);border-color:#9cc3f5}
.react b{font-weight:600;font-size:12px}
.replybar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;padding:5px 10px;margin-bottom:-1px}
.replybar b{color:var(--text)}
.replybar button{margin-left:auto}
.chatrow{display:flex;gap:8px;align-items:stretch}
.emojipop{position:fixed;z-index:60;background:var(--panel);border:1px solid #4a5638;border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.6);padding:8px;width:292px}
.emojipop .eg{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.emojipop button{background:none;border:0;border-radius:5px;font-size:20px;line-height:1;padding:5px 0;cursor:pointer}
.emojipop button:hover,.emojipop button:focus-visible{background:var(--panel-2)}
.emojipop .eh{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 2px 6px}
.cday{text-align:center;font-size:12px;color:var(--muted);margin:10px 0 4px}
.chatform{display:flex;flex-direction:column;border-top:1px solid var(--line);padding-top:10px}
.chatform textarea{min-height:42px;height:42px;resize:none}
.irows{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.irow{display:grid;grid-template-columns:140px minmax(180px,1fr) 130px 100px 38px;gap:8px;align-items:end}
.irow .field label{display:none}
.irow:first-child .field label{display:block}
.irow .rm{height:36px}
@media (max-width:700px){.irow{grid-template-columns:1fr 1fr;padding:8px;border:1px solid var(--line);border-radius:6px}.irow .field label{display:block}.irow .f-item{grid-column:1/-1}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
</head>
<body>
<div class="gate hidden" id="gate"><div class="card" id="gate-card"></div></div>
<div class="wrap hidden" id="app">
  <header class="top">
    <div class="whoami" id="whoami"></div>
    <h1>Ecologists Field Database<small>Russo-Belarussian Ecologist Mission · FOB stores, stalkers and staff</small></h1>
    <div class="kpis" id="kpis"></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <div class="status" id="status">Connecting to the database…</div>
  <main id="view"></main>
</div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>

<script>
"use strict";
const TABS=[["chat","FOB Chat"],["log","Storage Log"],["stock","In Storage"],["items","Items"],["stalkers","Stalkers"],["fob","FOB Team"],["profile","Character Profile"],["item","Item Profile"],["lists","Lists"]];
const DEFAULT_LISTS={actions:["Received","Given out"],categories:["Money","Ingredient","Crafted","Mutant Part","Artifact","Weapon","Ammo","Armor","Medical","Tool","Food","Misc"],storages:["Green Crate","Ecologists Trader"],factions:["Loner","Ecologist","Duty","Freedom","UN Military","Bandit","Mercenary","Monolith"],statuses:["Alive","MIA","KIA","Retired"],ranks:["Lead","Sr.","Sr. Sgt.","Sr. Pvt.","Cst.","Pvt."],teams:["Researcher","Doctor","Professor","Military"],qualities:["Normal","High","Pristine"],sources:["Supply","Chest check","Crafting"]};
const S={log:[],items:[],stalkers:[],fob:[],lists:DEFAULT_LISTS,ready:{log:false,items:false,stalkers:false,fob:false},
  canWrite:false,canEdit:false,isAdmin:false,flash:{},chat:[],dir:[],replyTo:null,chatDivider:null,chatErr:"",chatReady:false,me:null,members:[],openGroups:new Set(),f:{q:"",storage:"",action:"",cat:"",onlyStock:true},profile:"",itemSel:"",edit:null,draft:null};
let db=null,auth=null,assets=null,unsubs=[];
const DOMAIN="fob.local";
const toEmail=u=>u.trim().toLowerCase()+"@"+DOMAIN;
const validUser=u=>/^[a-z0-9._-]{3,30}$/i.test(u.trim());
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=new Intl.NumberFormat("cs-CZ");
const fmtN=n=>nf.format(n||0);
const pad=n=>String(n).padStart(2,"0");
const fmtTs=t=>{if(!t)return"";const d=new Date(t);return`${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fmtDay=t=>{if(!t)return"";const d=new Date(t);return`${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`};
const toLocalInput=t=>{const d=new Date(t);return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const byName=(a,b)=>(a.name||"").localeCompare(b.name||"",undefined,{sensitivity:"base",numeric:true});
const L=k=>(S.lists&&Array.isArray(S.lists[k])&&S.lists[k].length)?S.lists[k]:DEFAULT_LISTS[k];
const photoUrl=p=>p&&/^(data:|https?:|blob:)/.test(p)?p:"";

/* ---------- derived data ---------- */
function itemMap(){const m=new Map();for(const i of S.items)m.set((i.name||"").toLowerCase(),i);return m}
function categoryOf(name,m){const i=(m||itemMap()).get((name||"").toLowerCase());return i?(i.category||""):"?"}
function stockTable(){
  const st=new Map(),stor=L("storages");
  const get=n=>{const k=(n||"").toLowerCase();if(!st.has(k))st.set(k,{name:n,by:{},rec:0,out:0,count:0});return st.get(k)};
  for(const i of S.items)get(i.name);
  for(const r of S.log){const e=get(r.item),q=Number(r.qty)||0,s=r.storage||"";e.count++;
    if(r.action==="Received"){e.rec+=q;e.by[s]=(e.by[s]||0)+q}else if(r.action==="Given out"){e.out+=q;e.by[s]=(e.by[s]||0)-q}}
  for(const e of st.values())e.total=e.rec-e.out;
  return {st,stor};
}
const withList=r=>(r.with||"").split(",").map(x=>x.trim()).filter(Boolean);
const people=r=>[r.character,...withList(r)].filter(Boolean);
const involves=(r,name)=>people(r).includes(name);
function isRuble(n){return (n||"").toLowerCase()==="ruble"}

/* ---------- render shell ---------- */
function tabs(){return S.isAdmin?[...TABS,["accounts","Accounts"]]:TABS}
function route(){const h=(location.hash||"").replace("#","");return tabs().some(t=>t[0]===h)?h:"log"}
function renderTabs(){const cur=route(),n=chatUnread();
  $("#tabs").innerHTML=tabs().map(([k,l])=>`<a href="#${k}" ${k===cur?'aria-current="page"':""}>${l}${k==="chat"&&n?`<span class="tabdot" title="${n} new message${n===1?"":"s"}"></span><span class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"> (${n} new)</span>`:""}</a>`).join("");
  document.title=(n?`(${n>99?"99+":n}) `:"")+"Ecologists Field Database"}
function renderKpis(){
  const {st}=stockTable();let rub=0,items=0,kinds=0;
  for(const e of st.values()){if(isRuble(e.name))rub=e.total;else if(e.total>0){items+=e.total;kinds++}}
  $("#kpis").innerHTML=`<div class="kpi"><b>${fmtN(rub)}</b><span>Rubles in storage</span></div>
  <div class="kpi"><b>${fmtN(items)}</b><span>Items in storage (${kinds} kinds)</span></div>
  <div class="kpi"><b>${fmtN(S.log.length)}</b><span>Log entries</span></div>`;
}
function render(){
  renderTabs();renderKpis();
  captureForm();
  const v=route(),el=$("#view");
  const fn={log:viewLog,stock:viewStock,items:viewItems,stalkers:viewStalkers,fob:viewFob,profile:viewProfile,item:viewItem,lists:viewLists,accounts:viewAccounts,chat:viewChat}[v];
  el.innerHTML=fn();
  bindView(v);applyFlash();
}
function setStatus(t,err){const s=$("#status");s.textContent=t;s.className="status"+(err?" err":"")}

/* ---------- Storage Log ---------- */
function datalists(){
  const chars=[...L("sources"),...S.stalkers.map(s=>s.name).sort((a,b)=>a.localeCompare(b))];
  return `<datalist id="dl-chars">${chars.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
  <datalist id="dl-stalkers">${S.stalkers.slice().sort(byName).map(s=>`<option value="${esc(s.name)}">`).join("")}</datalist>
  <datalist id="dl-items">${S.items.slice().sort(byName).map(i=>`<option value="${esc(i.name)}">`).join("")}</datalist>
  <datalist id="dl-fob">${S.fob.slice().sort(byName).map(f=>`<option value="${esc(f.name)}">`).join("")}</datalist>`;
}
function opts(list,sel,blank){return (blank?`<option value="">${esc(blank)}</option>`:"")+list.map(o=>`<option ${o===sel?"selected":""}>${esc(o)}</option>`).join("")}
function resetForm(){const f=$("#entry");if(f)f.remove();S.formState=null;delete S.flash["e-msg"]}
function withFieldHtml(name){return `<div class="field w-field"><label>Stalker</label><div class="row" style="flex-wrap:nowrap"><input class="w-name" list="dl-stalkers" value="${esc(name||"")}" aria-label="Another stalker in this trade"><button class="btn" type="button" data-rmwith aria-label="Remove this stalker" title="Remove this stalker">✕</button></div></div>`}
function blankRow(action){return {action:action||"Received",item:"",quality:"",qty:""}}
function itemRowHtml(r,i,editing){
  return `<div class="irow">
    <div class="field"><label>Action</label><select class="r-action" aria-label="Action">${opts(L("actions"),r.action||"Received")}</select></div>

function logRows(){
  const m=itemMap(),f=S.f,q=f.q.toLowerCase();
  let rows=S.log.filter(r=>(!f.storage||r.storage===f.storage)&&(!f.action||r.action===f.action)&&
    (!q||[r.character,r.with,r.item,r.handledBy,r.notes].some(x=>(x||"").toLowerCase().includes(q))));
  rows.sort((a,b)=>(b.ts||0)-(a.ts||0)||(a.item||"").localeCompare(b.item||""));
  const out=[];let i=0;
  while(i<rows.length){const r=rows[i];
    if(r.character==="Chest check"){let j=i;while(j<rows.length&&rows[j].character==="Chest check"&&rows[j].ts===r.ts)j++;
      const grp=rows.slice(i,j);if(grp.length>2){out.push({group:true,key:"cc"+r.ts,rows:grp});i=j;continue}}
    out.push(r);i++}

}

async function saveEntry(){
  captureForm();const f=S.formState,msg=$("#e-msg");msg.className="msg";
  const rows=f.rows.map(r=>({...r,item:r.item.trim(),qty:Number(r.qty)})).filter(r=>r.item||r.qty);
  if(!f.character.trim()){msg.className="msg err";msg.textContent="Fill in the Character.";return}
  if(!rows.length){msg.className="msg err";msg.textContent="Add at least one item with a quantity.";return}
  const bad=rows.find(r=>!r.item||!(r.qty>0));
  if(bad){msg.className="msg err";msg.textContent=`Every item needs a name and a quantity above 0${bad.item?` (check “${bad.item}”)`:""}.`;return}
  const m=itemMap(),missing=rows.find(r=>!m.get(r.item.toLowerCase()));
  if(missing){msg.className="msg err";msg.innerHTML=`“${esc(missing.item)}” is not in the item list. <button class="btn small" type="button" id="e-additem">Add it to Items</button>`;
    $("#e-additem").onclick=()=>openItemModal(null,missing.item);return}
  const withs=[...new Set(f.withs.map(x=>x.trim()).filter(x=>x&&x!==f.character.trim()))];
  const base={ts:f.ts,character:f.character.trim(),with:withs.join(", "),storage:f.storage,handledBy:f.handledBy.trim(),notes:f.notes.trim()};
  const docs=rows.map(r=>({...base,action:r.action,item:m.get(r.item.toLowerCase()).name,quality:r.quality,qty:r.qty}));
  const btns=[...document.querySelectorAll("#entry button")];btns.forEach(b=>b.disabled=true);
  try{
    if(S.edit){await db.collection("log").doc(S.edit.id).set({...docs[0],by:S.edit.by||""});S.edit=null}
    else{const b=db.batch();for(const d of docs)b.set(db.collection("log").doc(),{...d,by:S.me?S.me.username:""});await b.commit()}
    resetForm();render();setMsg("e-msg","ok",docs.length>1?`Saved ${docs.length} items for this trade.`:"Saved.");
  }catch(err){btns.forEach(b=>b.disabled=false);msg.className="msg err";msg.textContent=errText(err)}
}
function errText(err){const c=err&&err.code;
  if(c==="permission-denied")return"You don't have permission to change the database. Ask the admin to check your role.";
  if(c==="resource-exhausted")return"The free daily limit is used up. It resets at midnight (US Pacific time).";
  if(c==="auth/email-already-in-use")return"That username is already taken.";
  if(c==="auth/weak-password")return"The password needs at least 6 characters.";
  if(c==="auth/wrong-password"||c==="auth/invalid-credential"||c==="auth/invalid-login-credentials"||c==="auth/user-not-found")return"Wrong username or password.";
  if(c==="auth/too-many-requests")return"Too many tries. Wait a few minutes and try again.";
  if(c==="auth/network-request-failed"||c==="unavailable")return"No connection. Check your internet and try again.";
  return"Something went wrong"+(c?` (${c})`:"")+". Try again in a moment."}

function pickerHtml(id,names,cur,ph){
  return `<div class="picker" id="${id}-wrap" data-names="${esc(JSON.stringify(names))}">
   <input id="${id}" value="${esc(cur)}" placeholder="${esc(ph)}" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="${id}-list" aria-label="${esc(ph)}">
   <span class="caret" aria-hidden="true">▾</span>
   <div class="picklist" id="${id}-list" role="listbox" hidden></div></div>`}
function bindPicker(id,set){
  const wrap=$("#"+id+"-wrap");if(!wrap)return;
  const el=$("#"+id),list=$("#"+id+"-list"),names=JSON.parse(wrap.dataset.names),cur=el.value;let shown=[],hi=0;
  const filter=q=>{q=q.trim().toLowerCase();if(!q)return names;const a=names.filter(n=>n.toLowerCase().startsWith(q)),b=names.filter(n=>!n.toLowerCase().startsWith(q)&&n.toLowerCase().includes(q));return a.concat(b)};
  const draw=()=>{list.innerHTML=shown.length?shown.map((n,i)=>`<div class="opt${i===hi?" hi":""}${n===cur?" cur":""}" role="option" data-i="${i}">${esc(n)}</div>`).join(""):`<div class="none">No match</div>`;
    const h=list.querySelector(".hi");if(h){const t=h.offsetTop,b=t+h.offsetHeight;if(t<list.scrollTop)list.scrollTop=t;else if(b>list.scrollTop+list.clientHeight)list.scrollTop=b-list.clientHeight}};
  const open=(q)=>{shown=filter(q);hi=Math.max(0,q?0:shown.indexOf(cur));list.hidden=false;el.setAttribute("aria-expanded","true");draw();
    if(!q){const h=list.querySelector(".hi");if(h)list.scrollTop=Math.max(0,h.offsetTop-list.clientHeight/2)}};
  const close=()=>{list.hidden=true;el.setAttribute("aria-expanded","false")};
  const pick=n=>{close();if(n&&n!==cur){set(n);render()}else el.value=cur};
  el.addEventListener("focus",()=>{el.select();open("")});
  el.addEventListener("click",()=>{if(list.hidden)open("")});
  wrap.querySelector(".caret").addEventListener("mousedown",ev=>{ev.preventDefault();if(list.hidden){el.focus()}else{close();el.blur()}});
  el.addEventListener("input",()=>open(el.value));
  el.addEventListener("keydown",ev=>{
    if(ev.key==="ArrowDown"){ev.preventDefault();if(list.hidden)open("");else{hi=Math.min(shown.length-1,hi+1);draw()}}
    else if(ev.key==="ArrowUp"){ev.preventDefault();hi=Math.max(0,hi-1);draw()}
    else if(ev.key==="Enter"){ev.preventDefault();if(shown[hi])pick(shown[hi])}
    else if(ev.key==="Escape"){ev.stopPropagation();close();el.value=cur;el.blur()}});
  list.addEventListener("mousedown",ev=>{ev.preventDefault();const o=ev.target.closest(".opt");if(o)pick(shown[+o.dataset.i])});
  list.addEventListener("mousemove",ev=>{const o=ev.target.closest(".opt");if(o&&+o.dataset.i!==hi){hi=+o.dataset.i;list.querySelectorAll(".opt").forEach(x=>x.classList.toggle("hi",+x.dataset.i===hi))}});
  el.addEventListener("blur",()=>setTimeout(()=>{if(document.activeElement!==el){close();el.value=cur}},120));
}

/* ---------- FOB Chat ---------- */
function chatSeenKey(){return "fobchat-seen-"+(S.me?S.me.id:"")}
function chatSeen(){try{return Number(localStorage.getItem(chatSeenKey()))||0}catch(_){return S._seen||0}}
function markChatRead(){const last=S.chat.length?S.chat[S.chat.length-1].ts:0;if(last>chatSeen()){S._seen=last;try{localStorage.setItem(chatSeenKey(),String(last))}catch(_){}}}
function chatUnread(){if(!S.me)return 0;const seen=chatSeen();if(!seen&&S.chat.length&&!S._seenInit){S._seenInit=true;markChatRead();return 0}return S.chat.filter(m=>m.ts>seen&&m.uid!==S.me.id).length}
function dirNames(){const set=new Set(S.dir.map(d=>(d.username||"").toLowerCase()));for(const m of S.chat)set.add((m.username||"").toLowerCase());return set}
const MENTION_RE=/(^|[^a-z0-9._-])@([a-z0-9._-]{3,30})/gi;
function mentionsMe(text){if(!S.me)return false;const me=S.me.username.toLowerCase();let m;MENTION_RE.lastIndex=0;while((m=MENTION_RE.exec(text||"")))if(m[2].toLowerCase()===me||m[2].toLowerCase()==="everyone")return true;return false}
function renderMentions(text){const known=dirNames(),me=S.me?S.me.username.toLowerCase():"";
  return esc(text).replace(/(^|[^a-z0-9._-])@([a-z0-9._-]{3,30})/gi,(all,pre,u)=>{const l=u.toLowerCase();
    if(l!=="everyone"&&!known.has(l))return all;return `${pre}<span class="mention${l===me||l==="everyone"?" me":""}">@${u}</span>`})}
const EMOJIS=["👍","👎","❤️","😂","😮","😢","😡","🔥","👀","✅","❌","💯","🎉","🙏","👏","💀","🤝","😎","🤔","😅","🫡","☢️","☣️","⚠️","💰","🔫","🩸","🍖","🧪","🔧","📦","🌲"];
const ekey=e=>"e"+[...e].map(c=>c.codePointAt(0).toString(16)).join("_");
const edecode=k=>String.fromCodePoint(...k.slice(1).split("_").map(h=>parseInt(h,16)));
function whoName(uid){const d=S.dir.find(x=>x.id===uid);if(d)return d.character||d.username;const m=S.chat.find(x=>x.uid===uid);return m?(m.character||m.username):"someone"}
function reactsHtml(m){const r=m.reactions||{};const ks=Object.keys(r).filter(k=>Array.isArray(r[k])&&r[k].length);if(!ks.length)return "";
  return `<div class="reacts">${ks.map(k=>{const on=S.me&&r[k].includes(S.me.id);const names=r[k].map(whoName).join(", ");
    return `<button type="button" class="react${on?" on":""}" data-togglereact="${m.id}" data-ek="${k}" title="${esc(names)}" aria-label="${esc(edecode(k))} ${r[k].length}, ${on?"remove your reaction":"react"}">${edecode(k)}<b>${r[k].length}</b></button>`}).join("")}</div>`}
async function toggleReact(id,emoji){const m=S.chat.find(x=>x.id===id);if(!m||!S.me)return;const k=ekey(emoji),cur=(m.reactions||{})[k]||[],FV=firebase.firestore.FieldValue;
  try{await db.collection("chat").doc(id).update({["reactions."+k]:cur.includes(S.me.id)?FV.arrayRemove(S.me.id):FV.arrayUnion(S.me.id)})}
  catch(e){setMsg("chat-msg","err",e.code==="permission-denied"?"Reactions aren't switched on yet — the admin needs to update the database rules.":errText(e))}}
function closeEmoji(){const p=$("#emoji-pop");if(p)p.remove()}
function openEmoji(anchor,onPick,title){closeEmoji();

  p.addEventListener("mousedown",ev=>ev.preventDefault());

function drawReplyBar(){const old=$("#replybar");if(old)old.remove();const f=$("#chat-form");if(f&&S.replyTo){f.insertAdjacentHTML("afterbegin",replyBarHtml());$("#reply-cancel").onclick=()=>{S.replyTo=null;drawReplyBar();$("#chat-text").focus()}}}
function startReply(id){const m=S.chat.find(x=>x.id===id);if(!m)return;
  S.replyTo={id:m.id,uid:m.uid,username:m.username,character:m.character||"",text:m.text.replace(/\s+/g," ").slice(0,100)};drawReplyBar();$("#chat-text").focus()}
function jumpTo(id){const el=$("#msg-"+id);if(!el){setMsg("chat-msg","err","That message is too old to show here, or it was deleted.");return}
  el.scrollIntoView({block:"center",behavior:"smooth"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash")}
function chatList(){
  if(S.chatErr)return `<div class="empty">${esc(S.chatErr)}</div>`;
  if(!S.chatReady)return `<div class="empty">Loading messages…</div>`;
  if(!S.chat.length)return `<div class="empty">No messages yet. Say hi to the FOB.</div>`;
  let out="",day="",lined=false;const cut=S.chatDivider;
  for(const m of S.chat){const d=fmtDay(m.ts);if(d!==day){day=d;out+=`<div class="cday">${d}</div>`}
    if(cut!=null&&!lined&&m.ts>cut&&S.me&&m.uid!==S.me.id){lined=true;out+=`<div class="newline" id="chat-new"><span>NEW</span></div>`}
    const mine=S.me&&m.uid===S.me.id,canDel=mine||S.isAdmin;const t=new Date(m.ts);
    const pinged=!mine&&(mentionsMe(m.text)||(m.replyTo&&S.me&&m.replyTo.uid===S.me.id));
    const rq=m.replyTo?`<div class="rq" data-jump="${esc(m.replyTo.id)}" title="Jump to the original message"><b>@${esc(m.replyTo.username||"")}</b>${esc(m.replyTo.text||"")}</div>`:"";
    out+=`<div class="cmsg ${mine?"mine":""} ${pinged?"pinged":""}" id="msg-${m.id}">${rq}<div class="tools"><button type="button" data-reactmsg="${m.id}" title="Add reaction" aria-label="Add reaction">😀</button><button type="button" data-replymsg="${m.id}" title="Reply" aria-label="Reply">↩ Reply</button>${canDel?`<button type="button" class="danger" data-delmsg="${m.id}" title="Delete message" aria-label="Delete message">✕</button>`:""}</div><span class="who">${esc(m.character||m.username)}</span>${m.character?` <span style="color:var(--muted);font-size:12px">@${esc(m.username)}</span>`:""}<span class="when">${pad(t.getHours())}:${pad(t.getMinutes())}</span><div class="txt">${renderMentions(m.text)}</div>${reactsHtml(m)}</div>`}
  return out;
}

function chatAtBottom(el){return el.scrollHeight-el.scrollTop-el.clientHeight<40}
function lastOtherTs(){for(let i=S.chat.length-1;i>=0;i--)if(!S.me||S.chat[i].uid!==S.me.id)return S.chat[i].ts;return 0}
function refreshChat(){const el=$("#chat-list");if(!el)return;const atBottom=chatAtBottom(el),top=el.scrollTop;
  if(S.chatDivider==null&&!atBottom&&chatUnread())S.chatDivider=chatSeen();
  el.innerHTML=chatList();el.scrollTop=atBottom?el.scrollHeight:top;checkChatRead()}
let chatFadeTimer=null;
function checkChatRead(){const el=$("#chat-list");if(!el||route()!=="chat"||document.hidden)return;
  if(!chatAtBottom(el))return;
  if(chatUnread()){markChatRead();renderTabs()}
  const line=$("#chat-new");
  if(line&&!chatFadeTimer)chatFadeTimer=setTimeout(()=>{chatFadeTimer=null;const l=$("#chat-new");if(l){l.classList.add("fade");setTimeout(()=>{const x=$("#chat-new");if(x)x.remove()},650)}S.chatDivider=null},2500)}
function openChat(){const el=$("#chat-list");if(!el)return;const line=$("#chat-new");
  if(line&&line.offsetTop>el.clientHeight-60)el.scrollTop=Math.max(0,line.offsetTop-40);else el.scrollTop=el.scrollHeight;
  el.addEventListener("scroll",checkChatRead,{passive:true});checkChatRead()}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkChatRead()});
function mentionCandidates(q){q=q.toLowerCase();const me=S.me?S.me.username:"";
  const list=[{username:"everyone",character:"ping all FOB members"},...S.dir.filter(d=>d.username&&d.username!==me).sort((a,b)=>a.username.localeCompare(b.username))];
  const a=list.filter(d=>d.username.toLowerCase().startsWith(q)||(d.character||"").toLowerCase().startsWith(q)),
        b=list.filter(d=>!a.includes(d)&&(d.username.toLowerCase().includes(q)||(d.character||"").toLowerCase().includes(q)));
  return a.concat(b).slice(0,8)}
let mbox={open:false,list:[],hi:0,start:0};
function mentionToken(ta){const before=ta.value.slice(0,ta.selectionStart),m=before.match(/(^|\s)@([a-z0-9._-]*)$/i);return m?{q:m[2],start:before.length-m[2].length-1}:null}
function drawMentionBox(){let box=$("#mention-box");
  if(!mbox.open||!mbox.list.length){if(box)box.remove();mbox.open=false;return}
  if(!box){$("#chat-form").insertAdjacentHTML("afterbegin",'<div class="mentionbox" id="mention-box" role="listbox"></div>');box=$("#mention-box")}
  box.innerHTML='<div class="mh">Members</div>'+mbox.list.map((d,i)=>`<div class="mo${i===mbox.hi?" hi":""}" data-mi="${i}" role="option"><b>@${esc(d.username)}</b><small>${esc(d.character||"")}</small></div>`).join("")}
function updateMentionBox(){const ta=$("#chat-text");if(!ta)return;const t=mentionToken(ta);
  if(!t){mbox.open=false;drawMentionBox();return}
  mbox={open:true,list:mentionCandidates(t.q),hi:0,start:t.start};drawMentionBox()}
function insertMention(d){const ta=$("#chat-text"),end=ta.selectionStart;
  ta.value=ta.value.slice(0,mbox.start)+"@"+d.username+" "+ta.value.slice(end);const pos=mbox.start+d.username.length+2;
  ta.setSelectionRange(pos,pos);ta.focus();mbox.open=false;drawMentionBox()}
async function sendChat(){
  const ta=$("#chat-text"),text=ta.value.trim();if(!text)return;
  if(text.length>1000){setMsg("chat-msg","err","Messages can be up to 1000 characters.");return}
  ta.value="";
  const doc={text,uid:S.me.id,username:S.me.username,character:S.me.character||"",ts:Date.now()};
  const reply=S.replyTo;if(reply)doc.replyTo=reply;S.replyTo=null;drawReplyBar();
  try{await db.collection("chat").add(doc);const cl=$("#chat-list");if(cl)cl.scrollTop=cl.scrollHeight;const m=$("#chat-msg");if(m)m.textContent="";delete S.flash["chat-msg"]}
  catch(e){ta.value=text;S.replyTo=reply;drawReplyBar();setMsg("chat-msg","err",e.code==="permission-denied"?"Chat isn't switched on yet — the admin needs to update the database rules.":errText(e))}
}

async function createAccount(){
  const u=$("#a-user").value.trim().toLowerCase(),p=$("#a-pass").value,ch=$("#a-char").value.trim(),role=$("#a-role").value;
  
  if(!validUser(u)){setMsg("a-msg","err","Username: 3–30 letters, numbers, dots, dashes or underscores, no spaces.");return}
  if(p.length<6){setMsg("a-msg","err","The password needs at least 6 characters.");return}
  if(S.members.some(m=>m.username===u)){setMsg("a-msg","err","That username is already taken.");return}
  const btns=[...document.querySelectorAll("#acc-new button")];btns.forEach(b=>b.disabled=true);setMsg("a-msg","","Creating…");
  let sec=firebase.apps.find(a=>a.name==="creator")||firebase.initializeApp(FIREBASE_CONFIG,"creator");
  try{
    const cred=await sec.auth().createUserWithEmailAndPassword(toEmail(u),p);
    await db.collection("members").doc(cred.user.uid).set({username:u,character:ch,role,active:true,created:Date.now()});
    await sec.auth().signOut();
    btns.forEach(b=>b.disabled=false);
    $("#a-user").value="";$("#a-pass").value="";$("#a-char").value="";
    setMsg("a-msg","ok",`Created. Give them — username: ${u} · password: ${p}`);
  }catch(e){try{await sec.auth().signOut()}catch(_){}btns.forEach(b=>b.disabled=false);setMsg("a-msg","err",errText(e))}
}
async function runImport(){
  const f=$("#imp-file").files[0];
  if(!f){setMsg("imp-msg","err","Pick the ecologists-data.json file first.");return}
  let data;try{data=JSON.parse(await f.text())}catch(_){setMsg("imp-msg","err","That file isn't valid JSON.");return}
  if(!data||data.format!=="ecologists-fob-seed-1"||!Array.isArray(data.docs)){setMsg("imp-msg","err","That isn't the Ecologists data file.");return}
  const ok=new Set(["log","items","stalkers","fob","config"]),docs=data.docs.filter(d=>d&&typeof d.path==="string"&&ok.has(d.path.split("/")[0])&&d.path.split("/").length===2);
  const b0=$("#imp button");b0.disabled=true;
  try{for(let i=0;i<docs.length;i+=200){const b=db.batch();for(const d of docs.slice(i,i+200))b.set(db.doc(d.path),d.data);await b.commit();setMsg("imp-msg","",`Imported ${Math.min(i+200,docs.length)} of ${docs.length}…`)}
    setMsg("imp-msg","ok",`Done — imported ${docs.length} records.`)}
  catch(e){setMsg("imp-msg","err",errText(e))}
  b0.disabled=false;
}

function randomPass(){const a="abcdefghjkmnpqrstuvwxyz23456789",r=crypto.getRandomValues(new Uint32Array(10));return [...r].map(x=>a[x%a.length]).join("")}

function shrinkImage(file,max){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*s)),h=Math.max(1,Math.round(img.height*s));
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
    let d=c.toDataURL("image/webp",0.82);if(!d.startsWith("data:image/webp"))d=c.toDataURL("image/jpeg",0.85);res(d)};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("That file isn't a picture I can read."))};img.src=url})}

let renderQueued=false;
function queueRender(){if(renderQueued)return;renderQueued=true;requestAnimationFrame(()=>{renderQueued=false;
  const a=document.activeElement;
  if(route()==="chat"&&$("#chat-list")){renderTabs();renderKpis();refreshChat();return}
  if(a&&a.closest&&(a.closest("#modal")||a.closest("#lists-form")||a.closest("#acc-new")||a.closest("#imp")||(a.dataset&&a.dataset.mchar))){renderKpis();return}
  if(a&&a.closest&&a.closest("#entry")&&route()==="log"){renderKpis();const {out,m}=logRows();const ls=$("#list-slot");if(ls){ls.innerHTML=logList(out,m);bindView("log-list")}return}
  render()})}
function sub(name,query){
  const timer=setTimeout(()=>{if(!S.ready[name])setStatus("Can't reach the database right now. Showing the last data loaded. Check your internet.",true)},10000);
  unsubs.push(query.onSnapshot({includeMetadataChanges:true},snap=>{S[name]=snap.docs.map(d=>({id:d.id,...d.data()}));if(!snap.metadata.fromCache){S.ready[name]=true;clearTimeout(timer)}
    if(Object.values(S.ready).every(Boolean))setStatus(S.canWrite?"Live · changes from other FOB members appear automatically.":"Live · view only.");
    queueRender()},err=>{clearTimeout(timer);S.ready[name]=true;setStatus(err.code==="permission-denied"?"Your account can't read this data. Ask the admin.":"Couldn't load part of the data. Reload the page to try again.",true);queueRender()}));
}
let dirSynced=false;
function syncSelfDir(){if(!S.me||dirSynced)return;dirSynced=true;const d=S.dir.find(x=>x.id===S.me.id),want={username:S.me.username,character:S.me.character||""};
  if(!d||d.username!==want.username||(d.character||"")!==want.character)db.collection("directory").doc(S.me.id).set(want).catch(()=>{dirSynced=false})}
function syncDirectory(){if(!S.isAdmin)return;
  for(const m of S.members){const d=S.dir.find(x=>x.id===m.id);
    if(m.active){if(!d||d.username!==m.username||(d.character||"")!==(m.character||""))db.collection("directory").doc(m.id).set({username:m.username,character:m.character||""}).catch(()=>{})}
    else if(d)db.collection("directory").doc(m.id).delete().catch(()=>{})}
  for(const d of S.dir)if(!S.members.some(m=>m.id===d.id))db.collection("directory").doc(d.id).delete().catch(()=>{})}
function stopData(){dirSynced=false;unsubs.forEach(u=>{try{u()}catch(_){}});unsubs=[];S.ready={log:false,items:false,stalkers:false,fob:false};S.log=[];S.items=[];S.stalkers=[];S.fob=[];S.members=[];S.chat=[];S.dir=[];S.chatReady=false;S.chatErr="";S._seenInit=false;S.formState=null;S.edit=null;S.flash={};S.chatDivider=null;S.replyTo=null}
function startData(){
  stopData();
  sub("log",db.collection("log").orderBy("ts","desc").limit(2000));
  sub("items",db.collection("items").limit(1000));
  sub("stalkers",db.collection("stalkers").limit(1000));
  sub("fob",db.collection("fob").limit(1000));
  unsubs.push(db.doc("config/lists").onSnapshot(s=>{if(s.exists){const d=s.data();S.lists={...DEFAULT_LISTS,...d}}queueRender()},()=>{}));
  unsubs.push(db.collection("chat").orderBy("ts","desc").limit(200).onSnapshot(s=>{S.chat=s.docs.map(d=>({id:d.id,...d.data()})).reverse();S.chatReady=true;S.chatErr="";
    if(route()==="chat"&&$("#chat-list")){renderTabs();refreshChat()}else queueRender()},
    err=>{S.chatReady=true;S.chatErr=err.code==="permission-denied"?"Chat isn't switched on yet — the admin needs to update the database rules in Firebase.":"Couldn't load the chat. Reload the page to try again.";queueRender()}));
  unsubs.push(db.collection("directory").onSnapshot(s=>{S.dir=s.docs.map(d=>({id:d.id,...d.data()}));syncSelfDir();
    if(route()==="chat"&&$("#chat-list"))refreshChat()},()=>{}));
  if(S.isAdmin)unsubs.push(db.collection("members").onSnapshot(s=>{S.members=s.docs.map(d=>({id:d.id,...d.data()}));syncDirectory();queueRender()},()=>{}));
}

    msg.className="msg";msg.textContent="Creating…";settingUp=true;
    try{const cred=await auth.createUserWithEmailAndPassword(toEmail(u),p);
      const b=db.batch();b.set(db.doc("members/"+cred.user.uid),{username:u,character:$("#g-char").value.trim(),role:"admin",active:true,created:Date.now()});
      b.set(db.doc("setup/state"),{done:true,admin:cred.user.uid,at:Date.now()});await b.commit();settingUp=false;onUser(cred.user)}
    catch(e){settingUp=false;gateNote=e.code==="permission-denied"?"Setup was already done. Log in instead.":errText(e);
      if(auth.currentUser){try{await auth.currentUser.delete()}catch(_){await auth.signOut()}}else{msg.className="msg err";msg.textContent=gateNote;gateNote=""}}};
}
let settingUp=false,meUnsub=null,gateNote="";
function renderWho(){$("#whoami").innerHTML=`<span>${esc(S.me.username)} · ${esc(S.me.role)}</span><button class="btn small" id="w-acc">Account</button><button class="btn small" id="w-out">Log out</button>`;
  $("#w-acc").onclick=openAccountModal;$("#w-out").onclick=()=>auth.signOut()}
function onUser(user){
  if(meUnsub){meUnsub();meUnsub=null}
  if(!user){stopData();S.me=null;S.isAdmin=S.canWrite=false;
    db.doc("setup/state").get().then(s=>s.exists?loginForm():setupForm()).catch(()=>loginForm());return}
  if(settingUp)return;
  showGate(`${GATE_HEAD}<p style="margin-top:12px">Checking your access…</p>`);
  meUnsub=db.doc("members/"+user.uid).onSnapshot(s=>{
    const m=s.exists?{id:s.id,...s.data()}:null;
    if(!m||!m.active){stopData();S.me=null;
      showGate(`${GATE_HEAD}<p style="margin-top:12px">${m?"Your account has been locked out. Ask the admin if this is a mistake.":"This account has no access. Ask the admin."}</p><button class="btn" id="g-out">Log out</button>`);
      $("#g-out").onclick=()=>auth.signOut();return}
    if(S.me&&S.me.id===m.id&&S.me.role===m.role&&S.me.character===m.character&&S.me.username===m.username)return;
    const wasAdmin=S.isAdmin,first=!S.me;
    S.me=m;S.isAdmin=m.role==="admin";S.canWrite=S.isAdmin||m.role==="member";S.canEdit=S.canWrite;
    showApp();renderWho();
    if(first||wasAdmin!==S.isAdmin)startData();
    render();
  },err=>loginForm("Couldn't check your access. Try logging in again."));
}
function init(){
  if(typeof firebase==="undefined"){showGate(`${GATE_HEAD}<p style="margin-top:12px;color:var(--bad)">Couldn't load the login system. Check your internet connection and reload.</p>`);return}
  if(typeof FIREBASE_CONFIG==="undefined"||!FIREBASE_CONFIG.apiKey||String(FIREBASE_CONFIG.apiKey).includes("PASTE")){showGate(`${GATE_HEAD}<p style="margin-top:12px;color:var(--bad)">Not set up yet: paste your Firebase settings into <b>config.js</b>.</p>`);return}
  firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();
  auth.onAuthStateChanged(onUser);
}
init();
</script>
